<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMACITY MUN • AIPPM Brief</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Georgia',serif;
    background:black;color:white;height:100vh;overflow:hidden;
}
body::before{
    content:"";position:fixed;inset:0;
    background:
    linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.95)),
    url("https://t4.ftcdn.net/jpg/16/09/14/03/360_F_1609140310_Gk0htXMO6xx6k0mangckTUve7PKZwyUV.jpg")
    no-repeat center/cover;
    transform:scale(1.15);z-index:-1;
}
.header{
    position:fixed;top:0;width:100%;padding:18px 0;
    text-align:center;font-size:13px;letter-spacing:3px;opacity:.7;
}
.center{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);text-align:center;width:90%;max-width:420px;
}
.login-box{
    border:1px solid #888;padding:40px 30px;border-radius:8px;
    backdrop-filter:blur(10px);
}
input{
    padding:12px;width:100%;margin-top:18px;
    background:black;border:1px solid white;color:white;
    text-align:center;font-size:16px;border-radius:4px;
}
input::placeholder {
    color: #888;
    opacity: 1;
}
button{
    margin-top:25px;padding:12px 35px;background:transparent;
    border:1px solid white;color:white;cursor:pointer;
    font-family:'Georgia',serif;
}
button:hover{background:white;color:black}
button:active{transform:scale(.98)}

.brief{display:none}
.intro{font-size:28px;opacity:0;transition:1.5s;margin-bottom:30px;line-height:1.4}
.card{
    margin-top:40px;opacity:0;transition:1.5s;
    padding:25px;border:1px solid #888;border-radius:8px;
    backdrop-filter:blur(10px);
}
.highlight{color:#d4af37;font-weight:bold}
.fullscreen-btn{
    position:fixed;bottom:20px;right:20px;
    border:1px solid white;background:black;color:white;
    padding:8px 12px;cursor:pointer;font-size:16px;
    border-radius:4px;
}
.fullscreen-btn:hover{background:white;color:black}
</style>
</head>

<body>

<div class="header">EMACITY MODEL UNITED NATIONS • AIPPM</div>

<div class="center">

<div id="login" class="login-box">
    <div style="font-size: 20px; margin-bottom: 20px;">ENTER DELEGATE ID</div>
    <input type="text" id="idInput" placeholder="AIPPM101" autocomplete="off">
    <button onclick="verify()">Access</button>
</div>

<div id="brief" class="brief">
    <div id="intro" class="intro">
        You are hereby summoned to the<br>
        <b>ALL INDIA POLITICAL PARTIES MEET</b>
    </div>

    <button id="enterBtn" onclick="startBriefing()" style="display:block;">ENTER SESSION</button>

    <div id="card" class="card">
        <p>Delegate: <span id="dname" class="highlight"></span></p>
        <p>Affiliation: <span id="party" class="highlight"></span></p>
        <p>Portfolio: <span id="portfolio" class="highlight"></span></p>
    </div>
</div>

</div>

<button class="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>

<script>
const delegates = {
"AIPPM101": { name:"Samruddhi Askar", party:"Indian National Congress", portfolio:"Dr. Shashi Tharoor" },
"AIPPM102": { name:"Bhagyashri Vikram Nagargoje", party:"Bharatiya Janata Party", portfolio:"Narendra Modi" },
"AIPPM103": { name:"Siddhesh Sachin Tiwari", party:"Bharatiya Janata Party", portfolio:"Amit Shah" },
"AIPPM104": { name:"Pruthviraj Chavan", party:"Bharatiya Janata Party", portfolio:"Nirmala Sitharaman" },
"AIPPM105": { name:"Putul Bafna", party:"Indian National Congress", portfolio:"Rahul Gandhi" },
"AIPPM106": { name:"Shaurya Atkari", party:"Shiv Sena (UBT)", portfolio:"Uddhav Thackeray" },
"AIPPM107": { name:"Ayna Philip", party:"Aam Aadmi Party", portfolio:"Raghav Chadha" },
"AIPPM108": { name:"Ayush Dinesh Wani", party:"Bharatiya Janata Party", portfolio:"S. Jaishankar" },
"AIPPM109": { name:"Shakalya Mishra", party:"Bharatiya Janata Party", portfolio:"Subramanian Swamy" },
"AIPPM110": { name:"Avani Nachiket Agashe", party:"Indian National Congress", portfolio:"P. Chidambaram" },
"AIPPM111": { name:"Tavish Bansal", party:"Bharatiya Janata Party", portfolio:"Rajnath Singh" },
"AIPPM112": { name:"Saharsh Bodana", party:"Aam Aadmi Party", portfolio:"Arvind Kejriwal" },
"AIPPM113": { name:"Prisha", party:"All India Trinamool Congress", portfolio:"Mamata Banerjee" },
"AIPPM114": { name:"Agastyaa Saurabh Soni", party:"Bharatiya Janata Party", portfolio:"Nitin Gadkari" },
"AIPPM115": { name:"Prabhjot Singh Nanda", party:"Indian National Congress", portfolio:"Manish Tiwari" },
"AIPPM116": { name:"Aaradhya karalay", party:"Indian National Congress", portfolio:"Sonia Gandhi" },
"AIPPM117": { name:"Vidit Tapadia", party:"Samajwadi Party", portfolio:"Akhilesh Yadav" },
"AIPPM118": { name:"Ritu", party:"Bharatiya Janata Party", portfolio:"Piyush Goyal" },
"AIPPM119": { name:"Mohrez Shaikh", party:"Indian National Congress", portfolio:"Jairam Ramesh" },
"AIPPM120": { name:"Swarali Sandeep Dombale", party:"Shiv Sena", portfolio:"Eknath Shinde" },
"AIPPM121": { name:"Vidit Tapadia", party:"Indian National Congress", portfolio:"Sachin Pilot" },
"AIPPM122": { name:"Siya Kamble", party:"Indian National Congress", portfolio:"Digvijaya Singh" },
"AIPPM123": { name:"Harrish Aravind K", party:"All India Majlis-e-Ittehadul Muslimeen", portfolio:"Asaduddin Owaisi" },
"AIPPM124": { name:"Avanish Dnyandeo Jadhav", party:"Bharatiya Janata Party", portfolio:"Dharmendra Pradhan" },
"AIPPM126": { name:"Mahika Shukla", party:"Indian National Congress", portfolio:"Mallikarjun Kharge" },
"AIPPM127": { name:"Saanvi Sharma", party:"Bharatiya Janata Party", portfolio:"Smriti Irani" },
"AIPPM128": { name:"Aditya Nanoti", party:"Bharatiya Janata Party", portfolio:"Manoj Tiwari" },
"AIPPM129": { name:"Pritam Bisoyi", party:"Bharat Rashtra Samithi", portfolio:"K. Chandrashekar Rao" },
"AIPPM130": { name:"Taniksha Elango", party:"NCP", portfolio:"Sharad Pawar" }
};

let audioContext = null;

function initAudioContext() {
    if (!audioContext) {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            console.log('Audio context not supported');
        }
    }
}

const input = document.getElementById("idInput");
const loginBox = document.getElementById("login");
const briefBox = document.getElementById("brief");
const introText = document.getElementById("intro");
const card = document.getElementById("card");
const enterBtn = document.getElementById("enterBtn");

input.focus();

input.addEventListener("keydown", e => {
    if (e.key === "Enter") verify();
});

input.addEventListener("input", () => {
    input.placeholder = "AIPPM101";
});

function normalizeID(v) {
    v = v.toUpperCase().replace(/\s/g, '');
    if (v.includes("AIPPM")) {
        let n = v.replace(/\D/g, '');
        return "AIPPM" + parseInt(n, 10).toString().padStart(3, '0');
    }
    return v;
}

function playGavelSound() {
    initAudioContext();
    // Simple beep sound as fallback since external audio files are missing
    if (audioContext) {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.2);
    }
}

function playVoiceSound() {
    initAudioContext();
    // Simple tone sequence as fallback
    if (audioContext) {
        const notes = [400, 500, 600, 500];
        let time = audioContext.currentTime;
        notes.forEach((freq, i) => {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = freq;
            gainNode.gain.setValueAtTime(0.2, time);
            gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            oscillator.start(time);
            oscillator.stop(time + 0.1);
            time += 0.15;
        });
    }
}

function verify() {
    let id = normalizeID(input.value);

    if (delegates[id]) {
        playGavelSound();

        let d = delegates[id];
        document.getElementById("dname").innerText = d.name;
        document.getElementById("party").innerText = d.party;
        document.getElementById("portfolio").innerText = d.portfolio;

        loginBox.style.display = "none";
        briefBox.style.display = "block";
        enterBtn.focus();
    } else {
        input.value = "";
        input.placeholder = "INVALID ID - Try Again";
        input.style.borderColor = "#ff4444";
        setTimeout(() => {
            input.style.borderColor = "white";
            input.placeholder = "AIPPM101";
        }, 1500);
    }
}

function startBriefing() {
    playVoiceSound();
    introText.style.opacity = 1;
    enterBtn.style.display = "none";
    
    setTimeout(() => {
        card.style.opacity = 1;
    }, 4000);
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log('Fullscreen failed:', err);
        });
    } else {
        document.exitFullscreen();
    }
}

// Handle fullscreen change
document.addEventListener('fullscreenchange', () => {
    const fullscreenBtn = document.querySelector('.fullscreen-btn');
    if (document.fullscreenElement) {
        fullscreenBtn.innerHTML = '✕';
    } else {
        fullscreenBtn.innerHTML = '⛶';
    }
});

// Prevent context menu on long press
document.addEventListener('contextmenu', e => e.preventDefault());

</script>

</body>
</html>
